; Liftoff - startup progress splash for Starfield
; Edit with any text editor. Changes apply the next time you launch the game.

[General]
; 0 turns the mod off without uninstalling it
Enabled=1

[Look]
; Progress bar colour, as #RRGGBB
BarColor=#4FC3F7
; Show what the game is loading right now (1 = yes, 0 = no)
ShowStatus=1
ShowPercent=1
; Use the Starfield UI typeface (Futura PT must be installed in Windows)
UseStarfieldFont=0
; Hide the panel and border, leaving the text and progress bar visible
TransparentBackground=0

[Behaviour]
; Keep the splash above the game window (works in windowed and borderless modes)
StayOnTop=1
; Milliseconds to fade out after the five-second completion display
FadeMs=500
; Safety net: close after this many seconds no matter what
TimeoutSeconds=240

[Tracking]
; File types that count as loading milestones
Extensions=.esm,.esp,.esl,.ba2
; Debug: 1 writes every file the game opens to Documents\My Games\Starfield\SFSE\Logs\Liftoff.log
LogAllFiles=0

[Files]
; Log file open durations (including non-plugin files) to Liftoff.log
LogFiles=1
; Include unsuccessful opens in the file log
LogFailedOpens=0
; Only write file opens at or above this duration, in milliseconds
MinOpenMs=0
; Limit file-open lines to prevent unbounded logs
MaxFileLines=100000

[Watchdog]
; Capture thread stacks if the game window stops responding this long
StallSeconds=3
; While loading a save, capture stacks at this interval
SampleSeconds=5
; Maximum stack captures per load or stall episode
MaxDumps=60
; Maximum frames shown for each stack
StackDepth=32
; Capture this many seconds of activity leading up to a save load
LookBackSeconds=10
